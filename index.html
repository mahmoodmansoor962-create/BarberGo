<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>BarberGo - منصة الحجز الذكية</title>
    <meta name="description" content="منصة الحجز الذكية للحلاقين بالذكاء الاصطناعي">

    <!-- Favicon to prevent 404s -->
    <link rel="icon" href="/favicon.ico">

    <!-- Google Fonts: Tajawal for Arabic UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Manifest for PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app"></div>
    <div id="toast-container"></div>

    <!-- Firebase Service -->
    <script type="module" src="firebase-service.js" defer></script>

    <!-- Scripts with proper loading order for performance -->
    <script src="notifications.js" defer></script>
    <script src="data.js" defer></script>
    
    <!-- Lazy-load component files for better mobile performance -->
    <script src="component-header.js" defer></script>
    <script src="component-loginform.js" defer></script>
    
    <script src="ui-components.js" defer></script>
    <script type="module" src="app.js"></script>
</body>

</html>
