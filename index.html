<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>BarberGo - منصة الحجز الذكية</title>
    <style>
        /* فرض ظهور الخلفية فوراً */
        body { background-color: #000000 !important; margin: 0; padding: 0; overflow-x: hidden; }
        #app { display: block !important; visibility: visible !important; opacity: 1 !important; min-height: 100vh; }
    </style>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="app"></div>

    <script src="./firebase-service.js"></script>
    <script src="./notifications.js"></script>
    <script src="./data.js"></script>
    <script src="./app.js?v=2.0.0"></script>

    <script>
        window.addEventListener('load', () => {
            const app = document.getElementById('app');
            // تأكيد الظهور بعد اكتمال التحميل
            if(app) {
                app.style.display = 'block';
                app.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
