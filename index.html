<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>BarberGo - منصة الحجز الذكية</title>
    <meta name="description" content="منصة الحجز الذكية للحلاقين بالذكاء الاصطناعي">

    <!-- Favicon stub to prevent 404s (percent-encoded SVG with emoji) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%92%88%3C/text%3E%3C/svg%3E">

    <!-- Google Fonts: Tajawal for Arabic UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Manifest for PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Main CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div id="app"></div>
    <div id="toast-container"></div>

    <!-- CRITICAL: Load all dependencies FIRST with defer to ensure proper ordering -->
    <!-- Firebase must be first (module), other scripts are regular with defer -->
    <script type="module" src="./firebase-service.js" defer></script>
    
    <!-- Notifications system - required for UI fallbacks -->
    <script src="./notifications.js" defer></script>
    
    <!-- Data persistence layer -->
    <script src="./data.js" defer></script>
    
    <!-- Component libraries - lazy-load for performance -->
    <script src="./component-header.js" defer></script>
    <script src="./component-loginform.js" defer></script>
    
    <!-- UI components - MUST load before app.js -->
    <script src="./ui-components.js" defer></script>
    
    <!-- Main app - loaded LAST with defer to ensure all dependencies are ready -->
    <!-- NOTE: This is a regular script (not module) with defer to prevent execution before dependencies -->
    <script src="./app.js" defer></script>

    <!-- Safety: Force #app visible immediately and on load to prevent stuck black screen -->
    <script>
        (function () {
            const forceShowApp = () => {
                try {
                    const appEl = document.getElementById('app');
                    if (appEl) {
                        appEl.style.setProperty('display', 'block', 'important');
                        appEl.style.visibility = 'visible';
                        appEl.style.opacity = '1';
                        appEl.style.pointerEvents = 'auto';
                    }

                    if (document.body) {
                        document.body.style.display = 'block';
                        document.body.style.visibility = 'visible';
                        document.body.style.opacity = '1';
                    }

                    // Hide known splash selectors if they exist (do not alter core CSS files)
                    const hideSelectors = ['#loading', '.loading-screen', '.splash', '.preloader', '.app-loading'];
                    hideSelectors.forEach(sel => {
                        try {
                            const el = document.querySelector(sel);
                            if (el) {
                                el.style.display = 'none';
                                el.style.visibility = 'hidden';
                            }
                        } catch (e) {}
                    });

                    console.info('[Safety] Forced #app visible');
                } catch (err) {
                    console.warn('[Safety] forceShowApp failed', err);
                }
            };

            forceShowApp();
            window.addEventListener('DOMContentLoaded', forceShowApp);
            window.addEventListener('load', forceShowApp);
        })();
    </script>
</body>

</html>
