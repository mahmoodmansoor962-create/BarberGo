<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberGo - منصة الحجز الذكية</title>
    
    <!-- الروابط الأساسية للتصميم الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-secondary: #AA8418;
            --bg-dark: #0a0a0a;
            --bg-card: #161616;
            --gold-gradient: linear-gradient(135deg, #D4AF37 0%, #AA8418 100%);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }

        .text-gold { color: var(--gold-primary); }
        
        /* تصميم البطاقات الفخم */
        .pill-box {
            background: var(--bg-card);
            border: 1px solid #222;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .border-gold { border: 1px solid var(--gold-primary) !important; }

        /* الأزرار */
        .btn-primary {
            background: var(--gold-gradient);
            border: none;
            color: #000;
            font-weight: 800;
            border-radius: 12px;
            padding: 15px;
            transition: 0.3s;
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); color: #000; }

        .btn-outline-gold {
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            background: transparent;
            border-radius: 12px;
            padding: 12px;
        }

        /* حقول الإدخال */
        .form-control {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 10px;
            padding: 12px;
            text-align: right;
        }

        .form-control:focus {
            border-color: var(--gold-primary);
            box-shadow: none;
            background: #050505;
            color: #fff;
        }

        /* الشارت البسيط */
        .chart-bar {
            width: 12%;
            background: var(--gold-gradient);
            border-radius: 5px 5px 0 0;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <script>
        // --- محرك التطبيق ---
        const app = {
            init() { this.navigate('welcome'); },
            navigate(page) {
                const container = document.getElementById('app');
                window.scrollTo(0,0);
                if(page === 'welcome') container.innerHTML = UI.renderWelcome();
                if(page === 'barberDash') container.innerHTML = UI.renderBarberDash();
                if(page === 'adminDash') container.innerHTML = UI.renderAdminDash();
            }
        };

        // --- واجهات التصميم الفخم ---
        const UI = {
            renderHeader(title) {
                return `
                    <div class="d-flex justify-content-between align-items-center p-4">
                        <div style="width: 45px; height: 45px; background: var(--gold-gradient); border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="app.navigate('welcome')">
                            <i class="fa-solid fa-chevron-right text-dark"></i>
                        </div>
                        <h4 class="text-gold fw-bold m-0">${title}</h4>
                        <div style="width: 45px;"></div>
                    </div>`;
            },

            renderWelcome() {
                return `
                    <div class="container text-center vh-100 d-flex flex-column justify-content-center px-4">
                        <div class="mb-5">
                            <i class="fa-solid fa-scissors text-gold mb-3" style="font-size: 5rem;"></i>
                            <h1 class="fw-black" style="font-size: 3.5rem; letter-spacing: -1px;">Barber<span class="text-gold">Go</span></h1>
                            <p class="text-muted">نظام الحجز الذكي - الأردن</p>
                        </div>
                        <div class="d-grid gap-3">
                            <button class="btn btn-primary shadow-lg" onclick="app.navigate('barberDash')">دخول صالونات الحلاقة</button>
                            <button class="btn btn-outline-gold" onclick="app.navigate('adminDash')">لوحة تحكم الإدارة</button>
                        </div>
                    </div>`;
            },

            renderBarberDash() {
                return `
                    ${this.renderHeader('لوحة الحلاق')}
                    <div class="container pb-5">
                        <!-- إحصائيات -->
                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <div class="pill-box p-3 text-center">
                                    <small class="text-muted d-block">دخل اليوم</small>
                                    <span class="fs-4 fw-bold">0 JOD</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="pill-box p-3 text-center">
                                    <small class="text-muted d-block">الحجوزات</small>
                                    <span class="fs-4 fw-bold text-gold">0</span>
                                </div>
                            </div>
                        </div>

                        <!-- الرسم البياني -->
                        <div class="pill-box">
                            <h6 class="text-gold mb-4 text-end">نشاط الحجز الأسبوعي</h6>
                            <div class="d-flex align-items-end justify-content-between" style="height: 120px;">
                                <div class="chart-bar" style="height: 40%;"></div>
                                <div class="chart-bar" style="height: 70%;"></div>
                                <div class="chart-bar" style="height: 50%;"></div>
                                <div class="chart-bar" style="height: 90%;"></div>
                                <div class="chart-bar" style="height: 60%;"></div>
                                <div class="chart-bar" style="height: 30%;"></div>
                                <div class="chart-bar" style="height: 80%;"></div>
                            </div>
                        </div>

                        <!-- تعديل الملف -->
                        <div class="pill-box border-gold">
                            <h5 class="text-gold mb-4 text-end">إعدادات ملف صالونك</h5>
                            <div class="mb-3">
                                <label class="small text-muted d-block mb-1">اسم الصالون</label>
                                <input type="text" class="form-control" placeholder="مثلاً: صالون الأناقة">
                            </div>
                            <div class="mb-3">
                                <label class="small text-muted d-block mb-1">السيرة الذاتية (Bio)</label>
                                <textarea class="form-control" rows="2" placeholder="أدخل نبذة لزبائنك..."></textarea>
                            </div>
                            <div class="mb-4">
                                <label class="small text-muted d-block mb-1">رقم التواصل</label>
                                <input type="text" class="form-control text-start" placeholder="07XXXXXXXX">
                            </div>
                            <button class="btn btn-primary w-100" onclick="alert('تم الحفظ بنجاح!')">حفظ التغييرات</button>
                        </div>
                    </div>`;
            },

            renderAdminDash() {
                return `
                    ${this.renderHeader('إدارة المنصة')}
                    <div class="container pb-5">
                        <div class="pill-box text-center py-5" style="background: var(--gold-gradient); border: none;">
                            <h6 class="text-dark fw-bold">إجمالي أرباح الاشتراك</h6>
                            <h1 class="text-dark fw-black" style="font-size: 3rem;">0.00 JOD</h1>
                        </div>

                        <div class="pill-box">
                            <h5 class="text-gold mb-4 text-end">بيانات استلام أموالي</h5>
                            <div class="mb-3">
                                <label class="small text-muted d-block mb-1">حساب CliQ</label>
                                <input type="text" class="form-control text-center fw-bold text-gold" value="MAHMOUD_GO">
                            </div>
                            <div class="mb-4">
                                <label class="small text-muted d-block mb-1">رقم المحفظة (زين كاش/أورنج)</label>
                                <input type="text" class="form-control text-center fw-bold text-gold" value="07XXXXXXXX">
                            </div>
                            <button class="btn btn-primary w-100" onclick="alert('تم التحديث')">تحديث بيانات الدفع</button>
                        </div>
                    </div>`;
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
