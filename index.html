<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberGo - منصة الحجز الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --gold-primary: #D4AF37; --bg-dark: #0a0a0a; --gold-gradient: linear-gradient(45deg, #D4AF37, #F2D06B); }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; }
        .text-gold { color: var(--gold-primary); }
        .btn-primary { background: var(--gold-gradient); border: none; color: black; font-weight: bold; border-radius: 10px; padding: 12px; }
        .pill-box { background: #1a1a1a; border: 1px solid #333; border-radius: 15px; padding: 20px; transition: 0.3s; }
        .form-control { background: #111; border: 1px solid #333; color: white; border-radius: 10px; }
        .form-control:focus { background: #151515; color: white; border-color: var(--gold-primary); box-shadow: none; }
    </style>
</head>
<body>

    <div id="app"></div>

    <script>
        // الواجهات (UI)
        const UI = {
            renderWelcome() {
                return `
                    <div class="container text-center vh-100 d-flex flex-column justify-content-center align-items-center">
                        <i class="fa-solid fa-crown mb-4 text-gold" style="font-size: 4rem;"></i>
                        <h1 class="text-gold fw-black mb-5" style="font-size: 3rem;">BarberGo</h1>
                        <div class="d-grid gap-3 w-100" style="max-width: 350px;">
                            <button class="pill-box text-white w-100" onclick="app.navigate('barberDash')">
                                <i class="fa-solid fa-scissors text-gold me-2"></i> دخول كـ حلاق
                            </button>
                            <button class="pill-box text-white w-100" onclick="app.navigate('adminDash')">
                                <i class="fa-solid fa-user-shield text-gold me-2"></i> دخول الإدارة
                            </button>
                        </div>
                    </div>`;
            },
            renderBarberDash() {
                return `
                    <div class="p-3 border-bottom border-warning mb-4">
                        <h4 class="text-gold m-0">لوحة الحلاق</h4>
                    </div>
                    <div class="container">
                        <div class="pill-box mb-4">
                            <h5 class="text-gold mb-3 text-end">بناء بروفايل صالونك</h5>
                            <input type="text" class="form-control mb-3 text-end" placeholder="اسم الصالون">
                            <textarea class="form-control mb-3 text-end" placeholder="وصف الخدمات"></textarea>
                            <input type="text" class="form-control mb-4 text-end" placeholder="رقم الواتساب">
                            <button class="btn btn-primary w-100">حفظ البيانات</button>
                        </div>
                        <button class="btn btn-dark w-100 text-muted" onclick="app.navigate('welcome')">رجوع للرئيسية</button>
                    </div>`;
            },
            renderAdminDash() {
                return `
                    <div class="p-3 border-bottom border-warning mb-4">
                        <h4 class="text-gold m-0 text-center">إدارة BarberGo</h4>
                    </div>
                    <div class="container text-end">
                        <div class="pill-box mb-4 text-center" style="background: var(--gold-gradient);">
                            <h6 class="text-dark fw-bold">أرباحك المتراكمة</h6>
                            <h2 class="text-dark fw-black">0.00 JOD</h2>
                        </div>
                        <div class="pill-box mb-4">
                            <h5 class="text-gold mb-3">بيانات تحصيل أموالك</h5>
                            <label class="small text-muted">حساب CliQ</label>
                            <input type="text" class="form-control mb-3 text-center text-gold" value="MAHMOUD_GO">
                            <label class="small text-muted">محفظة زين كاش</label>
                            <input type="text" class="form-control mb-4 text-center text-gold" value="07XXXXXXXX">
                            <button class="btn btn-primary w-100">تحديث بياناتي</button>
                        </div>
                        <button class="btn btn-dark w-100 text-muted" onclick="app.navigate('welcome')">رجوع</button>
                    </div>`;
            }
        };

        // المحرك (App Engine)
        const app = {
            init() { this.navigate('welcome'); },
            navigate(page) {
                const container = document.getElementById('app');
                if (page === 'welcome') container.innerHTML = UI.renderWelcome();
                if (page === 'barberDash') container.innerHTML = UI.renderBarberDash();
                if (page === 'adminDash') container.innerHTML = UI.renderAdminDash();
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
