<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberGo - الإدارة العامة</title>
    <meta name="description" content="لوحة تحكم الإدارة العامة لمنصة BarberGo">

    <!-- Favicon to prevent 404s -->
    <link rel="icon" href="/favicon.ico">
    <!-- Google Fonts: Tajawal for Arabic UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Manifest for PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body style="background: #111;">
    <div id="app"></div>
    <div id="toast-container"></div>

    <!-- Firebase Service -->
    <script type="module" src="firebase-service.js" defer></script>

    <!-- Scripts -->
    <script src="notifications.js" defer></script>
    <script src="data.js" defer></script>
    <script src="ui-components.js" defer></script>
    <script type="module" src="app.js"></script>
</body>

</html>
